name: Pack

# Every push and PR packs the package (which downloads SDL and checks its hashes); a v* tag also publishes it.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # nuget.org's trusted publishing: a short-lived key from GitHub's OIDC token, no stored secret

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        run: dotnet pack Kaldra.SDL3 -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/packages/*.nupkg
      - name: Log in to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --skip-duplicate
